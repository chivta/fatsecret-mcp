apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fatsecret

resources:
  - namespace.yaml
  # Encrypted with the shared app age key; Flux decrypts it in-cluster with
  # the `apps-sops-age` secret. Edit k8s/secrets.yaml (gitignored) and re-run
  # `sops -e k8s/secrets.yaml > k8s/secrets.enc.yaml` to change a value.
  - secrets.enc.yaml
  - server/pvc.yaml
  - server/deployment.yaml
  - server/service.yaml
  - server/service-monitor.yaml
  - ingress.yaml
