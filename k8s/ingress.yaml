apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fatsecret-mcp
  namespace: fatsecret
spec:
  ingressClassName: traefik
  rules:
    - host: fatsecret.chivtar.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fatsecret-mcp
                port:
                  number: 8080
